[package]
name = "ferrum-telemetry"
description = "Local, opt-in measurements of Ferrum itself for the benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Export format (p5.1): the same pinned versions as ferrum-core, so no new crate enters the build.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints]
workspace = true
