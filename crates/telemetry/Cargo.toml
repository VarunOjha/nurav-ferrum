[package]
name = "ferrum-telemetry"
description = "Local, opt-in measurements of Ferrum itself for the benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Export format (p5.1): the same pinned versions as ferrum-core, so no new crate enters the build.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
# Process counters (p5.3) and the Windows build for run lines (p5.11, registry, read only): the same windows version
# as webview-manager and the app.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[lints]
workspace = true
