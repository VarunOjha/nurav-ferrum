[package]
name = "ferrum-core"
description = "Shared types, configuration and errors used by every other Ferrum crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
url = "=2.5.8"
sha2 = "=0.11.0"
serde_json = "=1.0.154"
psl = "=2.1.241"
# Local store for history and bookmarks (adr-0032): SQLite compiled into Ferrum, nothing installed on the PC.
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[lints]
workspace = true
