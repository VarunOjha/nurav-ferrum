[package]
name = "ferrum-security"
description = "Decides which navigations, permissions and downloads are allowed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ferrum-core = { path = "../core" }
url = "=2.5.8"

[features]
# Benchmark-only ablation (p4.16, cfg-ferrum-nosecurity-bench, exp-security-overhead): the navigation policy lets every
# web address load without its rules. Never in a release artefact: the p4.16 check and CI prove the normal release
# build is made without it. Local test pages only.
bench-nosecurity = []

[lints]
workspace = true

[dev-dependencies]
# Randomised input tests of the policy (p4.2; qual-security-testing-plan tooling). Tests only, never in a build.
proptest = "=1.12.0"
