[package]
name = "ferrum-desktop"
description = "Ferrum: the Tauri application (trusted shell plus tab web views)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "ferrum-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["unstable"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
ferrum-core = { path = "../../../crates/core" }
ferrum-webview-manager = { path = "../../../crates/webview-manager" }
windows = { version = "=0.62.2", features = ["Win32_Foundation"] }

[lints]
workspace = true
