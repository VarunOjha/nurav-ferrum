[package]
name = "ferrum-desktop"
description = "Ferrum: the Tauri application (trusted shell plus tab web views)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "ferrum-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["unstable"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
zeroize = "=1.9.1"
ferrum-core = { path = "../../../crates/core" }
ferrum-security = { path = "../../../crates/security" }
ferrum-webview-manager = { path = "../../../crates/webview-manager" }
windows = { version = "=0.62.2", features = ["Win32_Foundation"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }

[features]
# Benchmark-only ablation build without the site rules (p4.16, cfg-ferrum-nosecurity-bench). Never in a release
# artefact; it starts only with --benchmark-mode.
bench-nosecurity = ["ferrum-security/bench-nosecurity"]

[lints]
workspace = true
