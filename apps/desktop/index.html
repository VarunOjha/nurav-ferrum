<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferrum shell</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The top band: tab strip, toolbar and the confirmation bar. Its height is reported to the app (shell_layout);
         tab views fill the space below it, so the shell never draws under a page. -->
    <div id="top">
      <nav id="tabstrip" aria-label="Tabs">
        <div id="tabs" role="tablist"></div>
        <button id="new-tab" class="strip-btn" type="button" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
      </nav>
      <header id="toolbar" role="toolbar" aria-label="Navigation" data-state="idle">
        <button id="back" class="nav" title="Back" aria-label="Back" disabled>&#x2190;</button>
        <button id="forward" class="nav" title="Forward" aria-label="Forward" disabled>&#x2192;</button>
        <button id="reload" class="nav" title="Reload" aria-label="Reload" disabled>&#x21bb;</button>
        <form id="address-form" autocomplete="off">
          <span id="lock" aria-hidden="true">&#x1f512;</span>
          <input id="address" type="text" spellcheck="false" placeholder="Enter an address" aria-label="Address" />
        </form>
        <span id="status" aria-live="polite"></span>
        <div id="progress" aria-hidden="true"></div>
      </header>
      <div id="external-bar" role="alertdialog" aria-labelledby="external-text" hidden>
        <span id="external-text">Open this link outside Ferrum?</span>
        <code id="external-uri"></code>
        <button id="external-open" type="button">Open</button>
        <button id="external-cancel" type="button">Cancel</button>
      </div>
      <div id="downloads" role="region" aria-label="Downloads" hidden>
        <ul id="download-list"></ul>
        <button id="downloads-clear" type="button" title="Remove finished downloads from this list">Clear</button>
      </div>
    </div>
    <!-- The content area: covered by the active tab's view, except while one of these shell panels shows. -->
    <main id="content-area">
      <section id="error-panel" role="alert" hidden>
        <h1 id="error-title">This page could not be loaded</h1>
        <p id="error-text"></p>
        <p id="error-address"></p>
        <button id="error-retry" type="button">Try again</button>
        <p id="error-code"></p>
      </section>
      <section id="empty-panel" hidden>
        <h1>No tabs open</h1>
        <p>Type an address above, or open a new tab with + (Ctrl+T).</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
